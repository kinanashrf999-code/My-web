<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lakeside Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f4f7ee; --pine:#0e281c; --moss:#7fb685; --gold:#f2c14e; --sky:#a9d6e5;
  --glass:rgba(10,30,21,.58); --glass-line:rgba(255,255,255,.22);
  --fs:17px; --wt:400;
}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{
  margin:0; min-height:100vh; color:var(--ink); font:var(--wt) 1rem/1.45 "Figtree",system-ui,sans-serif;
  background:#14301f url("https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=2400&q=80") center/cover fixed no-repeat;
}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(5,20,12,.25),rgba(5,20,12,.45));z-index:-1}
body.clear{--glass:rgba(6,20,13,.9); line-height:1.65; letter-spacing:.015em}
body.bold{--wt:700}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.glass{background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  border:1px solid var(--glass-line);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.wrap{max-width:1280px;margin:0 auto;padding:14px}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px 16px;margin-bottom:14px;font-size:.85rem}
.toolbar .grp{display:flex;align-items:center;gap:6px}
.tb{background:rgba(255,255,255,.12);border:1px solid var(--glass-line);border-radius:10px;padding:5px 11px;min-width:36px}
.tb:hover{background:rgba(255,255,255,.24)}
.tb[aria-pressed="true"]{background:var(--gold);color:#1a1a0a;border-color:var(--gold)}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.6);padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--gold);outline-offset:2px}
.brand{font-family:"Fraunces",serif;font-weight:700;font-size:1.15rem;margin-right:auto}

main{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:14px;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr}}

/* calendar */
.cal{padding:18px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.head h2{font-size:1.7rem;margin-right:auto}
.head input[type=number],.head select{background:rgba(255,255,255,.12);border:1px solid var(--glass-line);border-radius:10px;padding:5px 8px}
.head input[type=number]{width:5.5em}
.head option{color:#111}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dow{text-align:center;font-weight:700;font-size:.8rem;opacity:.8;padding:4px 0}
.day{min-height:5.6rem;padding:6px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid transparent;text-align:left;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.day:hover{background:rgba(255,255,255,.17)}
.day.out{opacity:.45}
.day.today .n{background:var(--gold);color:#1a1a0a;border-radius:50%;width:1.7em;height:1.7em;display:grid;place-items:center}
.day.sel{border-color:var(--gold);background:rgba(242,193,78,.16)}
.n{font-weight:700;font-size:.95rem}
.chip{font-size:.72rem;line-height:1.25;padding:1px 5px;border-radius:6px;background:rgba(127,182,133,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.appointment{background:rgba(169,214,229,.35)} .chip.reminder{background:rgba(242,193,78,.35)}
.chip.done{text-decoration:line-through;opacity:.6}
.more{font-size:.7rem;opacity:.8}
@media(max-width:600px){.day{min-height:3.6rem;padding:3px}.chip{display:none}.dots{display:flex!important}}
.dots{display:none;gap:3px;flex-wrap:wrap}.dots i{width:7px;height:7px;border-radius:50%;background:var(--moss)}

/* side panel */
.side{padding:18px}
.side h3{font-size:1.35rem}
.sub{opacity:.8;font-size:.85rem;margin:2px 0 12px}
.ev{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px;background:rgba(255,255,255,.09);margin-bottom:8px}
.ev input[type=checkbox]{width:1.2rem;height:1.2rem;margin-top:.2rem;accent-color:var(--gold)}
.ev .body{flex:1;min-width:0}
.ev .t{font-weight:700;overflow-wrap:anywhere}
.ev.done .t{text-decoration:line-through;opacity:.6}
.ev .m{font-size:.78rem;opacity:.8}
.ev .nt{font-size:.85rem;margin-top:3px;white-space:pre-wrap;overflow-wrap:anywhere}
.ev .act{display:flex;flex-direction:column;gap:4px}
.mini{background:none;border:1px solid var(--glass-line);border-radius:8px;padding:2px 8px;font-size:.78rem}
.mini:hover{background:rgba(255,255,255,.2)}
.empty{opacity:.8;padding:14px 4px}
form{display:grid;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--glass-line)}
form .row{display:flex;gap:8px}
form input,form select,form textarea{width:100%;background:rgba(255,255,255,.13);border:1px solid var(--glass-line);border-radius:10px;padding:8px 10px}
form option{color:#111}
textarea{min-height:5rem;resize:vertical}
.primary{background:var(--gold);color:#1a1a0a;border:0;border-radius:10px;padding:9px 14px;font-weight:700}
.ghost{background:rgba(255,255,255,.12);border:1px solid var(--glass-line);border-radius:10px;padding:9px 14px}
.foot{font-size:.75rem;opacity:.85;margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* highlight ("full mark") */
body.hl .t, body.hl .chip, body.hl .nt, body.hl .head h2, body.hl .side h3{background:#ffe066;color:#17210f;border-radius:4px;padding:0 .25em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
body.hl .chip{text-shadow:none}
@media(prefers-reduced-motion:no-preference){.day,.tb{transition:background .15s}}
</style>
</head>
<body>
<div class="wrap">
  <div class="glass toolbar" role="toolbar" aria-label="Text and readability controls">
    <span class="brand">Lakeside Calendar</span>
    <div class="grp" aria-label="Text size">
      <button class="tb" id="zOut" title="Smaller text" aria-label="Decrease text size">A−</button>
      <span id="zVal" aria-live="polite">17px</span>
      <button class="tb" id="zIn" title="Larger text" aria-label="Increase text size">A+</button>
      <button class="tb" id="zReset" title="Reset">Reset</button>
    </div>
    <div class="grp" id="colors" aria-label="Text color"></div>
    <div class="grp">
      <button class="tb" id="bBold" aria-pressed="false"><b>Bold</b></button>
      <button class="tb" id="bHl" aria-pressed="false"><mark style="background:#ffe066;color:#111;padding:0 4px;border-radius:3px">Highlight</mark></button>
      <button class="tb" id="bClear" aria-pressed="false" title="Darker panels, wider spacing">Clarity</button>
    </div>
  </div>

  <main>
    <section class="glass cal" aria-label="Calendar">
      <div class="head">
        <h2 id="title" aria-live="polite"></h2>
        <button class="tb" id="prev" aria-label="Previous month">‹</button>
        <button class="tb" id="today">Today</button>
        <button class="tb" id="next" aria-label="Next month">›</button>
        <select id="mSel" aria-label="Month"></select>
        <input type="number" id="ySel" aria-label="Year" min="1" max="9999">
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <aside class="glass side" aria-label="Day details">
      <h3 id="dTitle"></h3>
      <p class="sub" id="dSub"></p>
      <div id="list"></div>
      <form id="form">
        <input type="hidden" id="fId">
        <input id="fTitle" placeholder="What needs doing?" required maxlength="200" aria-label="Title">
        <div class="row">
          <select id="fType" aria-label="Type"><option value="task">Task</option><option value="appointment">Appointment</option><option value="reminder">Reminder</option></select>
          <input type="time" id="fTime" aria-label="Time">
        </div>
        <textarea id="fNotes" placeholder="Notes (optional)" aria-label="Notes"></textarea>
        <div class="row"><button class="primary" id="fSave">Add to this day</button><button type="button" class="ghost" id="fCancel" hidden>Cancel edit</button></div>
      </form>
      <div class="foot">
        <button class="mini" id="exp">Export backup</button>
        <button class="mini" id="imp">Import backup</button>
        <input type="file" id="file" accept="application/json" hidden>
        <span id="store"></span>
      </div>
    </aside>
  </main>
</div>

<script>
const $=s=>document.querySelector(s);
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const pad=n=>String(n).padStart(2,"0");
const key=d=>`${String(d.getFullYear()).padStart(4,"0")}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const mk=(y,m,d)=>{const x=new Date(2000,0,1);x.setFullYear(y,m,d);return x};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- IndexedDB storage (large capacity) ---------- */
let db;
const idb=new Promise((res,rej)=>{
  const r=indexedDB.open("lakeside-calendar",1);
  r.onupgradeneeded=()=>{const s=r.result.createObjectStore("events",{keyPath:"id"});s.createIndex("date","date")};
  r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error);
});
const store=m=>db.transaction("events",m).objectStore("events");
const done=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const range=(a,b)=>done(store("readonly").index("date").getAll(IDBKeyRange.bound(a,b)));
const put=e=>done(store("readwrite").put(e));
const del=id=>done(store("readwrite").delete(id));

/* ---------- state ---------- */
const now=new Date();
let view={y:now.getFullYear(),m:now.getMonth()};
let sel=key(now);
let cache=[];

const byDate=d=>cache.filter(e=>e.date===d).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99")||a.created-b.created);

async function load(){
  const first=mk(view.y,view.m,1);const start=mk(view.y,view.m,1-first.getDay());
  const end=mk(view.y,view.m,1-first.getDay()+41);
  cache=await range(key(start),key(end));
  const sd=sel; // selected may be outside grid
  if(sd<key(start)||sd>key(end)) cache=cache.concat(await range(sd,sd));
  render();
}

function render(){
  $("#title").textContent=`${MONTHS[view.m]} ${view.y}`;
  $("#mSel").value=view.m;$("#ySel").value=view.y;
  const g=$("#grid");g.innerHTML=DOW.map(d=>`<div class="dow">${d}</div>`).join("");
  const first=mk(view.y,view.m,1);const tk=key(now);
  for(let i=0;i<42;i++){
    const d=mk(view.y,view.m,1-first.getDay()+i),k=key(d),evs=byDate(k);
    const b=document.createElement("button");
    b.className="day"+(d.getMonth()!==view.m?" out":"")+(k===tk?" today":"")+(k===sel?" sel":"");
    b.setAttribute("aria-label",`${d.toDateString()}, ${evs.length} items`);
    b.innerHTML=`<span class="n">${d.getDate()}</span>`+
      evs.slice(0,2).map(e=>`<span class="chip ${e.type}${e.done?" done":""}">${e.time?e.time+" ":""}${esc(e.title)}</span>`).join("")+
      (evs.length>2?`<span class="more">+${evs.length-2} more</span>`:"")+
      (evs.length?`<span class="dots">${evs.slice(0,4).map(()=>"<i></i>").join("")}</span>`:"");
    b.onclick=()=>{sel=k;if(d.getMonth()!==view.m){view={y:d.getFullYear(),m:d.getMonth()};load()}else{render()}resetForm()};
    g.appendChild(b);
  }
  renderDay();
}

function renderDay(){
  const [y,m,d]=sel.split("-").map(Number);const dt=mk(y,m-1,d);
  $("#dTitle").textContent=dt.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
  const evs=byDate(sel);
  $("#dSub").textContent=`${y} · ${evs.length} item${evs.length===1?"":"s"}, ${evs.filter(e=>e.done).length} done`;
  const L=$("#list");
  if(!evs.length){L.innerHTML='<div class="empty">Nothing planned. Add a task, appointment or reminder below.</div>';return}
  L.innerHTML="";
  evs.forEach(e=>{
    const el=document.createElement("div");el.className="ev"+(e.done?" done":"");
    el.innerHTML=`<input type="checkbox" ${e.done?"checked":""} aria-label="Mark complete">
      <div class="body"><div class="t">${esc(e.title)}</div><div class="m">${e.type}${e.time?" at "+e.time:""}</div>${e.notes?`<div class="nt">${esc(e.notes)}</div>`:""}</div>
      <div class="act"><button class="mini" data-a="e">Edit</button><button class="mini" data-a="d">Delete</button></div>`;
    el.querySelector("input").onchange=async ev=>{e.done=ev.target.checked;await put(e);load()};
    el.querySelector('[data-a="e"]').onclick=()=>edit(e);
    el.querySelector('[data-a="d"]').onclick=async()=>{if(confirm(`Delete “${e.title}”?`)){await del(e.id);resetForm();load()}};
    L.appendChild(el);
  });
}

/* ---------- form ---------- */
function resetForm(){$("#form").reset();$("#fId").value="";$("#fSave").textContent="Add to this day";$("#fCancel").hidden=true}
function edit(e){
  $("#fId").value=e.id;$("#fTitle").value=e.title;$("#fType").value=e.type;$("#fTime").value=e.time||"";$("#fNotes").value=e.notes||"";
  $("#fSave").textContent="Save changes";$("#fCancel").hidden=false;$("#fTitle").focus();
}
$("#fCancel").onclick=resetForm;
$("#form").onsubmit=async ev=>{
  ev.preventDefault();
  const id=$("#fId").value;const old=id?cache.find(e=>e.id===id):null;
  const e=old||{id:crypto.randomUUID(),created:Date.now(),done:false};
  Object.assign(e,{date:sel,title:$("#fTitle").value.trim(),type:$("#fType").value,time:$("#fTime").value,notes:$("#fNotes").value.trim()});
  if(!e.title)return;
  await put(e);resetForm();load();
};

/* ---------- navigation ---------- */
const go=n=>{let m=view.m+n,y=view.y;while(m<0){m+=12;y--}while(m>11){m-=12;y++}view={y:Math.max(1,Math.min(9999,y)),m};load()};
$("#prev").onclick=()=>go(-1);$("#next").onclick=()=>go(1);
$("#today").onclick=()=>{view={y:now.getFullYear(),m:now.getMonth()};sel=key(now);resetForm();load()};
$("#mSel").innerHTML=MONTHS.map((m,i)=>`<option value="${i}">${m}</option>`).join("");
$("#mSel").onchange=e=>{view.m=+e.target.value;load()};
$("#ySel").onchange=e=>{const y=parseInt(e.target.value);if(y>=1&&y<=9999){view.y=y;load()}};
document.addEventListener("keydown",e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==="ArrowLeft")go(-1);if(e.key==="ArrowRight")go(1)});

/* ---------- backup ---------- */
$("#exp").onclick=async()=>{
  const all=await done(store("readonly").getAll());
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(all)],{type:"application/json"}));
  a.download=`calendar-backup-${key(new Date())}.json`;a.click();
};
$("#imp").onclick=()=>$("#file").click();
$("#file").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const arr=JSON.parse(await f.text());for(const x of arr)if(x.id&&x.date&&x.title)await put(x);alert(`Imported ${arr.length} items.`);load()}
  catch{alert("That file isn't a valid calendar backup.")}
  e.target.value="";
};

/* ---------- text controls (saved in localStorage) ---------- */
const COLORS=[["Ivory","#f4f7ee"],["White","#ffffff"],["Mint","#b8f0c4"],["Gold","#ffd76a"],["Sky","#bfe6f5"],["Peach","#ffc9b0"]];
let pref={fs:17,color:"#f4f7ee",bold:false,hl:false,clear:false};
try{Object.assign(pref,JSON.parse(localStorage.getItem("lc-pref")||"{}"))}catch{}
function applyPref(){
  document.documentElement.style.setProperty("--fs",pref.fs+"px");
  document.documentElement.style.setProperty("--ink",pref.color);
  document.body.classList.toggle("bold",pref.bold);document.body.classList.toggle("hl",pref.hl);document.body.classList.toggle("clear",pref.clear);
  $("#zVal").textContent=pref.fs+"px";
  $("#bBold").setAttribute("aria-pressed",pref.bold);$("#bHl").setAttribute("aria-pressed",pref.hl);$("#bClear").setAttribute("aria-pressed",pref.clear);
  document.querySelectorAll(".sw").forEach(s=>s.setAttribute("aria-pressed",s.dataset.c===pref.color));
  try{localStorage.setItem("lc-pref",JSON.stringify(pref))}catch{}
}
$("#colors").innerHTML=COLORS.map(([n,c])=>`<button class="sw" data-c="${c}" style="background:${c}" title="${n}" aria-label="${n} text"></button>`).join("")+
  `<input type="color" id="cPick" value="${pref.color}" title="Custom color" aria-label="Custom text color" style="width:30px;height:26px;border:0;background:none;padding:0">`;
document.querySelectorAll(".sw").forEach(s=>s.onclick=()=>{pref.color=s.dataset.c;applyPref()});
$("#cPick").oninput=e=>{pref.color=e.target.value;applyPref()};
$("#zIn").onclick=()=>{pref.fs=Math.min(32,pref.fs+1);applyPref()};
$("#zOut").onclick=()=>{pref.fs=Math.max(12,pref.fs-1);applyPref()};
$("#zReset").onclick=()=>{pref={fs:17,color:"#f4f7ee",bold:false,hl:false,clear:false};applyPref()};
$("#bBold").onclick=()=>{pref.bold=!pref.bold;applyPref()};
$("#bHl").onclick=()=>{pref.hl=!pref.hl;applyPref()};
$("#bClear").onclick=()=>{pref.clear=!pref.clear;applyPref()};

/* ---------- start ---------- */
(async()=>{
  applyPref();
  try{
    await idb;
    if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist();
    if(navigator.storage&&navigator.storage.estimate){const q=await navigator.storage.estimate();$("#store").textContent=`Storage available: ${(q.quota/1048576).toFixed(0)} MB`}
    load();
  }catch(e){$("#list").textContent="Storage is unavailable in this browser mode (private window?). Open the file in a normal window."}
})();
</script>
</body>
</html>
